version: '3.8'

services:
  dashboard:
    build: .
    # If you publish your image to Docker Hub, you can replace 'build: .' with:
    # image: your-dockerhub-username/asreview-dashboard:latest
    container_name: asreview-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Tell nginx-proxy which domains to route to this container
      - VIRTUAL_HOST=${DOMAIN}
      # Tell acme-companion to generate a Let's Encrypt certificate for this domain
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    expose:
      - "5050"
    # We do NOT publish ports to the host here; Nginx handles all public web traffic.

  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
      # Allow proxy to watch for containers starting/stopping
      - /var/run/docker.sock:/tmp/docker.sock:ro

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-acme-companion
    restart: unless-stopped
    volumes_from:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      # Allow companion to watch for containers requesting certs
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  conf:
  vhost:
  html:
  certs:
  acme:
