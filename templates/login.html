{% extends "base.html" %}

{% block title %}Sign In - ASReview Reviewer Analytics{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">📊</div>
      <h2>ASReview Analytics</h2>
      <p>Sign in with your ASReview server credentials to inspect reviewer screening metrics.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <div class="form-group">
        <label for="email">ASReview Email / Username</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="reviewer@example.com" 
          required 
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign In & Continue</button>
    </form>

    <div class="auth-footer-note">
      <p>Target ASReview Server: <code>{{ asreview_base_url }}</code></p>
    </div>
  </div>
</div>
{% endblock %}
