version: '3.8'

services:
  dashboard:
    image: aryanbytescode/asreview-dashboard:latest
    container_name: asreview-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5050}:${PORT:-5050}"
    # The container will be accessible at http://dashboard:5050 internally

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - dashboard
