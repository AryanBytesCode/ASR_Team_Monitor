version: '3.8'

services:
  dashboard:
    build: .
    # If you publish your image to Docker Hub, you can replace 'build: .' with:
    # image: your-dockerhub-username/asreview-dashboard:latest
    container_name: asreview-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5050}:${PORT:-5050}"
